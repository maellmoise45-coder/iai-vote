# ============================================================
#  Blueprint Render.com - Digital-Elect
# ------------------------------------------------------------
#  Deploie UNIQUEMENT le service web (gratuit).
#
#  La base de donnees n'est PAS creee ici : la base PostgreSQL
#  gratuite de Render n'existe plus. On utilise une base
#  PostgreSQL gratuite externe (Neon) et on renseigne son
#  adresse dans la variable DATABASE_URL (demandee a la
#  creation du service).
#
#  Render lit ce fichier automatiquement ("New > Blueprint").
# ============================================================
services:
  - type: web
    name: iai-vote
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: APP_SECRET
        generateValue: true
      # Jeton exige par api/install.php. La valeur generee est
      # visible dans Render > Environment et sert d'en-tete
      # X-Install-Token le temps de l'installation.
      - key: INSTALL_TOKEN
        generateValue: true
      # Adresse de la base PostgreSQL (ex. Neon) : a coller
      # au moment de la creation du service, puis modifiable
      # dans Environment.
      - key: DATABASE_URL
        sync: false
