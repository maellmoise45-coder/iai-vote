<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0c2a63">
    <title>Connexion — Digital-Elect</title>
    <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/style.css?v=8">
</head>
<body class="page-connexion">

    <div class="carte-connexion">
        <div class="logo-entete">
            <img class="logo-image" src="images/logo.svg" alt="Logo Digital-Elect">
            <div>
                <div class="logo-titre">Digital-<span class="accent">Elect</span></div>
                <div class="logo-sous">Plateforme de vote électronique</div>
            </div>
            <span class="logo-badge">Scrutin sécurisé</span>
        </div>

        <div id="message"></div>

        <form id="form-connexion" autocomplete="on">
            <div class="champ">
                <label for="matricule">Matricule</label>
                <input type="text" id="matricule" name="matricule"
                       placeholder="ex : ETU22A001" required autofocus autocomplete="username">
            </div>

            <div class="champ">
                <label for="mot_de_passe">Mot de passe</label>
                <input type="password" id="mot_de_passe" name="mot_de_passe"
                       placeholder="••••••••" required autocomplete="current-password">
            </div>

            <button type="submit" class="btn btn-primaire btn-bloc" id="btn-connexion">
                Se connecter
            </button>
        </form>

        <p class="lien-secondaire">
            <a href="resultats.html">Consulter les résultats publics</a>
        </p>
    </div>

    <footer class="pied-page">
        <span class="credit">Créé par MOISE</span>
    </footer>

    <script src="js/api.js?v=8"></script>
    <script src="js/login.js?v=8"></script>
</body>
</html>
